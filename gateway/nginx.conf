server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Local-Only-Guarantee "Air-Gapped: Enterprise Self-Host Suite Gateway" always;

    # Enterprise Portal Landing Page
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Static assets for portal
    location /portal-assets/ {
        root /usr/share/nginx/html;
    }

    # ── 1. Client-Side Reality Engines ──────────────────────────────────
    location /lease-audit/ {
        proxy_pass http://lease-audit:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /care-check/ {
        proxy_pass http://care-check:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /paystub-check/ {
        proxy_pass http://paystub-check:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /bill-of-rights/ {
        proxy_pass http://bill-of-rights-bot:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /warranty-watch/ {
        proxy_pass http://warranty-watch:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 2. Backend Reality Engines ──────────────────────────────────────
    location /gradcast/ {
        proxy_pass http://gradcast:5062/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mail-stripper/ {
        proxy_pass http://mail-stripper:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ftaas/ {
        proxy_pass http://ftaas-api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 3. OpenTelemetry Collector Ingestion Proxy ─────────────────────
    # Enables seamless in-browser OTLP reporting without cross-origin issues
    location /otlp/ {
        proxy_pass http://otel-collector:4318/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
    }

    # ── 4. Observability Dashboards ─────────────────────────────────────
    location /jaeger/ {
        proxy_pass http://jaeger:16686/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Healthcheck
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
