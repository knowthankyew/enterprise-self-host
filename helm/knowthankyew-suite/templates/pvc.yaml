{{- $root := . -}}

{{- if and .Values.services.gradcast.enabled .Values.services.gradcast.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "knowthankyew-suite.fullname" $root }}-gradcast-data
  labels:
    {{- include "knowthankyew-suite.labels" $root | nindent 4 }}
    app.kubernetes.io/name: gradcast
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.services.gradcast.persistence.size | default "5Gi" }}
---
{{- end }}

