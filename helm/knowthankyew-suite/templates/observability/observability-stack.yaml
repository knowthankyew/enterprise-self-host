{{- if .Values.observability.grafana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowthankyew-suite.fullname" $root }}-grafana
  labels:
    {{- include "knowthankyew-suite.labels" $root | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        {{- include "knowthankyew-suite.labels" $root | nindent 8 }}
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.observability.grafana.image.repository }}:{{ .Values.observability.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.observability.grafana.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "knowthankyew-suite.labels" $root | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: grafana
{{- end }}
