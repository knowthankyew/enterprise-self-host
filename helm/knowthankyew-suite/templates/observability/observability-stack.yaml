{{- $root := . -}}

{{- if .Values.observability.collector.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowthankyew-suite.fullname" $root }}-otel-collector
  labels:
    {{- include "knowthankyew-suite.labels" $root | nindent 4 }}
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        {{- include "knowthankyew-suite.labels" $root | nindent 8 }}
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: "{{ .Values.observability.collector.image.repository }}:{{ .Values.observability.collector.image.tag }}"
          imagePullPolicy: {{ .Values.observability.collector.image.pullPolicy }}
          command:
            - "/otelcol-contrib"
            - "--config=/etc/otelcol-contrib/config.yaml"
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8889
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: otel-collector-config.yaml
          resources:
            {{- toYaml .Values.observability.collector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "knowthankyew-suite.fullname" $root }}-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    {{- include "knowthankyew-suite.labels" $root | nindent 4 }}
    app.kubernetes.io/name: otel-collector
spec:
  type: ClusterIP
  ports:
    - port: 4317
      targetPort: otlp-grpc
      name: otlp-grpc
    - port: 4318
      targetPort: otlp-http
      name: otlp-http
    - port: 8889
      targetPort: metrics
      name: metrics
  selector:
    app.kubernetes.io/name: otel-collector
{{- end }}

{{- if .Values.observability.jaeger.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowthankyew-suite.fullname" $root }}-jaeger
  labels:
    {{- include "knowthankyew-suite.labels" $root | nindent 4 }}
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        {{- include "knowthankyew-suite.labels" $root | nindent 8 }}
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: "{{ .Values.observability.jaeger.image.repository }}:{{ .Values.observability.jaeger.image.tag }}"
          imagePullPolicy: {{ .Values.observability.jaeger.image.pullPolicy }}
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: MEMORY_MAX_TRACES
              value: {{ .Values.observability.jaeger.memoryMaxTraces | default 10000 | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    {{- include "knowthankyew-suite.labels" $root | nindent 4 }}
    app.kubernetes.io/name: jaeger
spec:
  type: ClusterIP
  ports:
    - port: 16686
      targetPort: ui
      name: ui
    - port: 4317
      targetPort: otlp-grpc
      name: otlp-grpc
  selector:
    app.kubernetes.io/name: jaeger
{{- end }}

