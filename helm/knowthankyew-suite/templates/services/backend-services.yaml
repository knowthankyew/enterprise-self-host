{{- $root := . -}}

{{- if .Values.services.gradcast.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowthankyew-suite.fullname" $root }}-gradcast
  labels:
    {{- include "knowthankyew-suite.labels" $root | nindent 4 }}
    app.kubernetes.io/name: gradcast
spec:
  replicas: {{ .Values.services.gradcast.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gradcast
  template:
    metadata:
      labels:
        {{- include "knowthankyew-suite.labels" $root | nindent 8 }}
        app.kubernetes.io/name: gradcast
    spec:
      containers:
        - name: gradcast
          image: "{{ .Values.services.gradcast.image.repository }}:{{ .Values.services.gradcast.image.tag }}"
          imagePullPolicy: {{ .Values.services.gradcast.image.pullPolicy }}
          ports:
            - containerPort: 5062
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ if eq .Values.mode "enterprise" }}http://otel-collector:4317{{ end }}"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.services.gradcast.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gradcast
  labels:
    {{- include "knowthankyew-suite.labels" $root | nindent 4 }}
    app.kubernetes.io/name: gradcast
spec:
  type: ClusterIP
  ports:
    - port: 5062
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: gradcast
{{- end }}

