exporters:
  # Route traces to local Jaeger instance (in-memory circular buffer)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Expose metrics endpoint scraped by local Prometheus instance
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: knowthankyew
    send_timestamps: true
    metric_expiration: 180m
    resource_to_telemetry_conversion:
      enabled: true

  # Local stdout audit logger for compliance inspection
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_noncompliant_traces, transform, batch]
      exporters: [otlp/jaeger, spanmetrics, debug]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, transform/metrics_preflight, filter/drop_noncompliant_metrics, transform, batch]
      exporters: [prometheus, debug]
  telemetry:
    logs:
      level: info
