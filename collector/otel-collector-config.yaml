# ==============================================================================
# OpenTelemetry Collector Configuration - knowthankyew Portfolio
# Enforces Pillar 3 (Strict Allowlist Sanitization) & Local-Only Air-Gap Routing
# ==============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://127.0.0.1:*"
            - "http://*.local:*"
            - "*"
          allowed_headers:
            - "*"

connectors:
  # Transforms incoming privacy-scrubbed spans into Prometheus operational metrics
  spanmetrics:
    dimensions_cache_size: 1000
    resource_metrics_cache_size: 100
    metrics_expiration: 180m
    histogram:
      explicit:
        buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
    dimensions:
      - name: status
      - name: jurisdiction
    exclude_dimensions: [span.name]
    metrics_flush_interval: 15s

processors:
  # Pillar 1: Prevent memory exhaustion on resource-constrained deployment nodes
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # Batch telemetry to optimize disk & network I/O
  batch:
    send_batch_size: 256
    timeout: 1s

  # Strict fail-closed metrics admission pipeline (Collector v0.118.0):
  # - transform/metrics_preflight strips non-allowlisted resource attributes unconditionally
  #   via keep_keys and enforces scope/datapoint allowlists via overflow markers
  #   (`kty.scope_overflow`, `kty.scrubbed_overflow`), eliminating stateful aggregation and
  #   exponential histogram conversion (avoiding v0.118.0 stream-collapse/bucket bugs).
  # - filter/drop_noncompliant_traces drops spans carrying SpanLinks (`Len(links) > 0`),
  #   since Collector v0.118.0 OTTL lacks a `spanlink` transform context for link attributes.
  # - filter/drop_noncompliant_metrics drops non-compliant metrics/datapoints fail-closed.
  # - Production SDKs pre-scrub dimensions via @knowthankyew/privacy-telemetry and SafeAllowlist.
  transform/metrics_preflight:
    error_mode: propagate
    metric_statements:
      - context: resource
        statements:
          - set(cache["kty_raw_resource_len"], Len(attributes))
          - keep_keys(attributes, ["deployment.environment", "service.instance.id", "service.name", "service.namespace", "service.version", "telemetry.sdk.language", "telemetry.sdk.name", "telemetry.sdk.version"])
          - set(cache["kty_scrubbed_resource_len"], Len(attributes))
          - set(attributes["kty.resource_overflow"], "drop") where cache["kty_scrubbed_resource_len"] < cache["kty_raw_resource_len"]
          - set(attributes["kty.resource_overflow"], "drop") where (attributes["deployment.environment"] != nil and not IsString(attributes["deployment.environment"])) or (attributes["service.instance.id"] != nil and not IsString(attributes["service.instance.id"])) or (attributes["service.name"] != nil and not IsString(attributes["service.name"])) or (attributes["service.namespace"] != nil and not IsString(attributes["service.namespace"])) or (attributes["service.version"] != nil and not IsString(attributes["service.version"])) or (attributes["telemetry.sdk.language"] != nil and not IsString(attributes["telemetry.sdk.language"])) or (attributes["telemetry.sdk.name"] != nil and not IsString(attributes["telemetry.sdk.name"])) or (attributes["telemetry.sdk.version"] != nil and not IsString(attributes["telemetry.sdk.version"]))
          - set(attributes["kty.resource_overflow"], "drop") where attributes["deployment.environment"] != nil and (not IsString(attributes["deployment.environment"]) or (attributes["deployment.environment"] != "" and attributes["deployment.environment"] != "[REDACTED_SENSITIVE_VALUE]" and not IsMatch(attributes["deployment.environment"], "^(?:development|dev|staging|stage|production|prod|test|testing|ci|local|sandbox|preview|Development|Staging|Production|enterprise|consumer|airgap|self-hosted)$")))
          - set(attributes["kty.resource_overflow"], "drop") where attributes["service.instance.id"] != nil and (not IsString(attributes["service.instance.id"]) or (attributes["service.instance.id"] != "" and attributes["service.instance.id"] != "[REDACTED_SENSITIVE_VALUE]" and not IsMatch(attributes["service.instance.id"], "^(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[0-9a-fA-F]{12,64}|(?:hmac|sha256):[0-9a-f]{16,64})$")))
          - set(attributes["kty.resource_overflow"], "drop") where attributes["service.name"] != nil and (not IsString(attributes["service.name"]) or (attributes["service.name"] != "" and attributes["service.name"] != "[REDACTED_SENSITIVE_VALUE]" and not IsMatch(attributes["service.name"], "^(?:knowthankyew-(?:app|extension)|privacy-telemetry|lease-audit|care-check|careCheck|paystub-check|bill-of-rights-bot|warranty-watch|ftaas-(?:api|worker|inference)|surprisal-service|howso-preflight|mail-stripper(?:-imap)?|unsubscribe-shield-ext|gradcast|genesis|mac-screen-record|kty-ntfs|enterprise-self-host|test-svc|unknown|unknown_service(?::(?:python|node|nodejs|dotnet|go|webjs))?)$")))
          - set(attributes["kty.resource_overflow"], "drop") where attributes["service.namespace"] != nil and (not IsString(attributes["service.namespace"]) or (attributes["service.namespace"] != "" and attributes["service.namespace"] != "[REDACTED_SENSITIVE_VALUE]" and not IsMatch(attributes["service.namespace"], "^(?:knowthankyew(?:-[a-z0-9_-]{1,32})?|ftaas)$")))
          - set(attributes["kty.resource_overflow"], "drop") where attributes["service.version"] != nil and (not IsString(attributes["service.version"]) or (attributes["service.version"] != "" and attributes["service.version"] != "[REDACTED_SENSITIVE_VALUE]" and not IsMatch(attributes["service.version"], "^v?[0-9]+\\.[0-9]+\\.[0-9]+(?:\\.[0-9]+)?(?:[-+][0-9A-Za-z._-]{1,32})?$")))
          - set(attributes["kty.resource_overflow"], "drop") where attributes["telemetry.sdk.language"] != nil and (not IsString(attributes["telemetry.sdk.language"]) or (attributes["telemetry.sdk.language"] != "" and attributes["telemetry.sdk.language"] != "[REDACTED_SENSITIVE_VALUE]" and not IsMatch(attributes["telemetry.sdk.language"], "^(?:cpp|dotnet|erlang|go|java|js|nodejs|php|python|ruby|rust|swift|webjs)$")))
          - set(attributes["kty.resource_overflow"], "drop") where attributes["telemetry.sdk.name"] != nil and (not IsString(attributes["telemetry.sdk.name"]) or (attributes["telemetry.sdk.name"] != "" and attributes["telemetry.sdk.name"] != "[REDACTED_SENSITIVE_VALUE]" and not IsMatch(attributes["telemetry.sdk.name"], "^(?:opentelemetry|otlp-json|@knowthankyew/[a-z0-9_-]{1,40}|KnowThankYew\\.[A-Za-z0-9_.-]{1,48})$")))
          - set(attributes["kty.resource_overflow"], "drop") where attributes["telemetry.sdk.version"] != nil and (not IsString(attributes["telemetry.sdk.version"]) or (attributes["telemetry.sdk.version"] != "" and attributes["telemetry.sdk.version"] != "[REDACTED_SENSITIVE_VALUE]" and not IsMatch(attributes["telemetry.sdk.version"], "^v?[0-9]+\\.[0-9]+\\.[0-9]+(?:\\.[0-9]+)?(?:[-+][0-9A-Za-z._-]{1,32})?$")))
          - set(schema_url, "") where schema_url != ""
      - context: scope
        statements:
          - set(cache["kty_raw_scope_len"], Len(attributes))
          - keep_keys(attributes, [])
          - set(attributes["kty.scope_overflow"], "drop") where cache["kty_raw_scope_len"] > 0
          - set(attributes["kty.scope_overflow"], "drop") where name != "" and not IsMatch(name, "^(?:@knowthankyew/[a-z0-9_-]{1,40}|KnowThankYew(?:\\.[A-Za-z0-9_-]{1,36}){1,5}|Kty(?:\\.[A-Za-z0-9_-]{1,36}){1,5}|FtaaSService(?:\\.[A-Za-z0-9_-]{1,36}){1,5}|knowthankyew(?:-[a-z0-9_-]{1,32})?|spanmetrics(?:connector)?|opentelemetry(?:-collector|\\.[A-Za-z0-9_.-]{1,36})?)$")
          - set(version, "") where version != "" and not IsMatch(version, "^v?[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z]{1,12}(?:\\.[0-9A-Za-z]{1,12}){0,2})?$")
          - set(schema_url, "") where schema_url != ""
      - context: datapoint
        statements:
          - set(cache["kty_raw_len"], Len(attributes))
          - keep_keys(attributes, ["action", "adapter_path", "adapter_size_bytes", "audit.allowlist_enforced", "audit.collector_verified", "audit_status", "base_model", "char_count", "charity_eligible", "clause_count", "current_step", "dataset_hash", "dataset_relative_path", "device", "discount_percent", "discrepancy_count", "duration_ms", "duration_sec", "error_code", "error_type", "exchange", "flagged_clauses", "flagged_count", "has_balance_due", "has_deductions", "has_illegal_tie_in", "has_implied_disclaimer", "has_income_verified", "has_itemized_breakdown", "has_overtime", "howso.cases.ablated_count", "howso.cases.anomalous_count", "howso.cases.original_count", "howso.preflight.duration_ms", "howso.preflight.enabled", "howso.preflight.status", "http.method", "http.status_code", "is_compliant", "job_id", "jurisdiction", "line_count", "loss", "matched_violations", "ocr_used", "overtime_hours", "parsed_line_count", "product_category", "product_type", "progress_pct", "protection_score", "redflag_count", "regular_hours", "risk_level", "routing_key", "rule_id", "rule_ids", "score_percentage", "service", "service.name", "sidecar_active", "span.kind", "standard_count", "state", "status", "status.code", "statute_code", "step", "surprisal.cases.ablated_count", "surprisal.cases.anomalous_count", "surprisal.cases.original_count", "surprisal.preflight.duration_ms", "surprisal.preflight.enabled", "surprisal.preflight.status", "total_clauses", "total_steps", "unconditional_gift_triggered", "unenforceable_count", "unlawful_count", "violations_count", "warranty_type", "watch_count"])
          - set(cache["kty_scrubbed_len"], Len(attributes))
          - set(attributes["kty.scrubbed_overflow"], "drop") where cache["kty_scrubbed_len"] < cache["kty_raw_len"]
          - set(attributes["kty.scrubbed_overflow"], "drop") where (attributes["action"] != nil and not IsString(attributes["action"])) or (attributes["adapter_path"] != nil and not IsString(attributes["adapter_path"])) or (attributes["adapter_size_bytes"] != nil and not IsInt(attributes["adapter_size_bytes"]) and not IsDouble(attributes["adapter_size_bytes"])) or (attributes["audit.allowlist_enforced"] != nil and not IsBool(attributes["audit.allowlist_enforced"]) and attributes["audit.allowlist_enforced"] != "true" and attributes["audit.allowlist_enforced"] != "false") or (attributes["audit.collector_verified"] != nil and not IsBool(attributes["audit.collector_verified"]) and attributes["audit.collector_verified"] != "true" and attributes["audit.collector_verified"] != "false") or (attributes["audit_status"] != nil and not IsString(attributes["audit_status"])) or (attributes["base_model"] != nil and not IsString(attributes["base_model"])) or (attributes["char_count"] != nil and not IsInt(attributes["char_count"]) and not IsDouble(attributes["char_count"])) or (attributes["charity_eligible"] != nil and not IsBool(attributes["charity_eligible"])) or (attributes["clause_count"] != nil and not IsInt(attributes["clause_count"]) and not IsDouble(attributes["clause_count"]))
          - set(attributes["kty.scrubbed_overflow"], "drop") where (attributes["current_step"] != nil and not IsInt(attributes["current_step"]) and not IsDouble(attributes["current_step"])) or (attributes["dataset_hash"] != nil and not IsString(attributes["dataset_hash"])) or (attributes["dataset_relative_path"] != nil and not IsString(attributes["dataset_relative_path"])) or (attributes["device"] != nil and not IsString(attributes["device"])) or (attributes["discount_percent"] != nil and not IsInt(attributes["discount_percent"]) and not IsDouble(attributes["discount_percent"])) or (attributes["discrepancy_count"] != nil and not IsInt(attributes["discrepancy_count"]) and not IsDouble(attributes["discrepancy_count"])) or (attributes["duration_ms"] != nil and not IsInt(attributes["duration_ms"]) and not IsDouble(attributes["duration_ms"])) or (attributes["duration_sec"] != nil and not IsInt(attributes["duration_sec"]) and not IsDouble(attributes["duration_sec"])) or (attributes["error_code"] != nil and not IsString(attributes["error_code"])) or (attributes["error_type"] != nil and not IsString(attributes["error_type"]))
          - set(attributes["kty.scrubbed_overflow"], "drop") where (attributes["exchange"] != nil and not IsString(attributes["exchange"])) or (attributes["flagged_clauses"] != nil and not IsInt(attributes["flagged_clauses"]) and not IsDouble(attributes["flagged_clauses"])) or (attributes["flagged_count"] != nil and not IsInt(attributes["flagged_count"]) and not IsDouble(attributes["flagged_count"])) or (attributes["has_balance_due"] != nil and not IsBool(attributes["has_balance_due"])) or (attributes["has_deductions"] != nil and not IsBool(attributes["has_deductions"])) or (attributes["has_illegal_tie_in"] != nil and not IsBool(attributes["has_illegal_tie_in"])) or (attributes["has_implied_disclaimer"] != nil and not IsBool(attributes["has_implied_disclaimer"])) or (attributes["has_income_verified"] != nil and not IsBool(attributes["has_income_verified"])) or (attributes["has_itemized_breakdown"] != nil and not IsBool(attributes["has_itemized_breakdown"])) or (attributes["has_overtime"] != nil and not IsBool(attributes["has_overtime"]))
          - set(attributes["kty.scrubbed_overflow"], "drop") where (attributes["howso.cases.ablated_count"] != nil and not IsInt(attributes["howso.cases.ablated_count"]) and not IsDouble(attributes["howso.cases.ablated_count"])) or (attributes["howso.cases.anomalous_count"] != nil and not IsInt(attributes["howso.cases.anomalous_count"]) and not IsDouble(attributes["howso.cases.anomalous_count"])) or (attributes["howso.cases.original_count"] != nil and not IsInt(attributes["howso.cases.original_count"]) and not IsDouble(attributes["howso.cases.original_count"])) or (attributes["howso.preflight.duration_ms"] != nil and not IsInt(attributes["howso.preflight.duration_ms"]) and not IsDouble(attributes["howso.preflight.duration_ms"])) or (attributes["howso.preflight.enabled"] != nil and not IsBool(attributes["howso.preflight.enabled"])) or (attributes["howso.preflight.status"] != nil and not IsString(attributes["howso.preflight.status"])) or (attributes["http.method"] != nil and not IsString(attributes["http.method"])) or (attributes["http.status_code"] != nil and not IsInt(attributes["http.status_code"]) and not IsDouble(attributes["http.status_code"])) or (attributes["is_compliant"] != nil and not IsBool(attributes["is_compliant"])) or (attributes["job_id"] != nil and not IsString(attributes["job_id"]))
          - set(attributes["kty.scrubbed_overflow"], "drop") where (attributes["jurisdiction"] != nil and not IsString(attributes["jurisdiction"])) or (attributes["line_count"] != nil and not IsInt(attributes["line_count"]) and not IsDouble(attributes["line_count"])) or (attributes["loss"] != nil and not IsInt(attributes["loss"]) and not IsDouble(attributes["loss"])) or (attributes["matched_violations"] != nil and not IsInt(attributes["matched_violations"]) and not IsDouble(attributes["matched_violations"])) or (attributes["ocr_used"] != nil and not IsBool(attributes["ocr_used"])) or (attributes["overtime_hours"] != nil and not IsInt(attributes["overtime_hours"]) and not IsDouble(attributes["overtime_hours"])) or (attributes["parsed_line_count"] != nil and not IsInt(attributes["parsed_line_count"]) and not IsDouble(attributes["parsed_line_count"])) or (attributes["product_category"] != nil and not IsString(attributes["product_category"])) or (attributes["product_type"] != nil and not IsString(attributes["product_type"])) or (attributes["progress_pct"] != nil and not IsInt(attributes["progress_pct"]) and not IsDouble(attributes["progress_pct"]))
          - set(attributes["kty.scrubbed_overflow"], "drop") where (attributes["protection_score"] != nil and not IsInt(attributes["protection_score"]) and not IsDouble(attributes["protection_score"])) or (attributes["redflag_count"] != nil and not IsInt(attributes["redflag_count"]) and not IsDouble(attributes["redflag_count"])) or (attributes["regular_hours"] != nil and not IsInt(attributes["regular_hours"]) and not IsDouble(attributes["regular_hours"])) or (attributes["risk_level"] != nil and not IsString(attributes["risk_level"])) or (attributes["routing_key"] != nil and not IsString(attributes["routing_key"])) or (attributes["rule_id"] != nil and not IsString(attributes["rule_id"])) or (attributes["rule_ids"] != nil and not (IsString(attributes["rule_ids"]) and (attributes["rule_ids"] == "" or attributes["rule_ids"] == "[REDACTED_SENSITIVE_VALUE]" or (Len(attributes["rule_ids"]) <= 3600 and not IsMatch(attributes["rule_ids"], "^(?:[^,]*,){50}") and not IsMatch(attributes["rule_ids"], "[^,]{72}") and IsMatch(attributes["rule_ids"], "^(?:AR-00[1-3]|ARB-00[1-3]|UNI-00[12]|SURV-00[12]|US-(?:CO|IL|OR)-001|EU-(?:AR-00[12]|SURV-001)|UK-(?:AR-00[12]|CONS-001)|CA-(?:SEC-DEP-CAP-01|SEC-DEP-RET-02|ENTRY-NOT-03|EVICT-SLF-04|HABIT-REP-05|LATE-FEE-06)|FL-(?:SEC-DEP-RET-01|ENTRY-NOT-02|PROHIB-PRAC-03|HABIT-REP-04)|IL-(?:SEC-DEP-RET-01|EVICT-SLF-02|RETALIAT-03|DEP-INT-04)|NY-(?:SEC-DEP-CAP-01|SEC-DEP-RET-02|ENTRY-NOT-06|LATE-FEE-03|EVICT-SLF-04|HABIT-WAR-05|OCCUP-ROOM-07)|TX-(?:SEC-DEP-RET-01|LATE-FEE-02|LOCKOUT-SLF-03|UTIL-SHUT-04|HABIT-REP-05)|FED-(?:FHA-FAM-01|FHA-DIS-02|SCRA-MIL-03|LEAD-DISC-04)|illegal_(?:register_shortage|uniform_equipment)_deduction|salaried_under_(?:exemption_)?threshold|missing_overtime_multiplier|unexplained_mandatory_fee|fica_math_mismatch|KTY-WARRANTY-(?:EXCL|DISCLAIM)-001|WARRANTY_VOID_IF_REMOVED|CA_CIV_1950_5|FLSA_EXEMPT_541|implied_warranty_disclaimer|state_(?:daily_overtime|implied_override)_(?:AL|AK|AZ|AR|CA|CO|CT|DE|DC|FL|GA|HI|ID|IL|IN|IA|KS|