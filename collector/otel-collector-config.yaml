# ==============================================================================
# OpenTelemetry Collector Configuration - knowthankyew Portfolio
# Enforces Pillar 3 (Strict Allowlist Sanitization) & Local-Only Air-Gap Routing
# ==============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://127.0.0.1:*"
            - "http://*.local:*"
            - "*"
          allowed_headers:
            - "*"

connectors:
  # Transforms incoming privacy-scrubbed spans into Prometheus operational metrics
  spanmetrics:
    histogram:
      explicit:
        buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
    dimensions:
      - name: status
      - name: rule_id
      - name: jurisdiction
    metrics_flush_interval: 15s

processors:
  # Pillar 1: Prevent memory exhaustion on resource-constrained deployment nodes
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # Batch telemetry to optimize disk & network I/O
  batch:
    send_batch_size: 256
    timeout: 1s

  # Pillar 3: Boundary Enforcer - OpenTelemetry Transformation Language (OTTL)
  # Strictly keeps only SAFE_ALLOWLIST_KEYS. Any unlisted attribute (e.g. clause text,
  # snippet, PII) is permanently dropped at the collector boundary.
  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - keep_keys(attributes, ["action", "adapter_path", "adapter_size_bytes", "agreement_title", "audit.allowlist_enforced", "audit.collector_verified", "audit_status", "base_model", "char_count", "charity_eligible", "clause_count", "current_step", "dataset_hash", "dataset_relative_path", "device", "discount_percent", "discrepancy_count", "duration_ms", "duration_sec", "error_code", "error_type", "exchange", "flagged_clauses", "flagged_count", "fpl_percentage", "has_balance_due", "has_deductions", "has_illegal_tie_in", "has_implied_disclaimer", "has_income_verified", "has_itemized_breakdown", "has_overtime", "hospital_id", "household_size", "howso.cases.ablated_count", "howso.cases.anomalous_count", "howso.cases.original_count", "howso.preflight.duration_ms", "howso.preflight.enabled", "howso.preflight.status", "http.method", "http.status_code", "http.target", "is_compliant", "job_id", "jurisdiction", "line_count", "loss", "matched_violations", "ocr_used", "overtime_hours", "parsed_line_count", "product_category", "product_type", "progress_pct", "protection_score", "redflag_count", "regular_hours", "risk_level", "routing_key", "rule_id", "rule_ids", "score_percentage", "service", "service.name", "sidecar_active", "standard_count", "state", "status", "statute_code", "step", "surprisal.cases.ablated_count", "surprisal.cases.anomalous_count", "surprisal.cases.original_count", "surprisal.preflight.duration_ms", "surprisal.preflight.enabled", "surprisal.preflight.status", "total_clauses", "total_steps", "unconditional_gift_triggered", "unenforceable_count", "unlawful_count", "violations_count", "warranty_type", "watch_count"])
          - set(attributes["audit.collector_verified"], "true")
          - set(attributes["audit.allowlist_enforced"], "true")

exporters:
  # Route traces to local Jaeger instance (in-memory circular buffer)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Expose metrics endpoint scraped by local Prometheus instance
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: knowthankyew
    send_timestamps: true
    metric_expiration: 180m

  # Local stdout audit logger for compliance inspection
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform, batch]
      exporters: [otlp/jaeger, spanmetrics, debug]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
  telemetry:
    logs:
      level: info
