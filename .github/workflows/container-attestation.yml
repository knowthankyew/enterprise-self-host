name: Container Build & Supply Chain Attestation

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    name: Build & Attest Containers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: gateway
            context: ./gateway
            dockerfile: ./gateway/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3

      - name: Build Container Image
        id: build-image
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/kty-${{ matrix.service.name }}:test"
          docker build -t "$IMAGE_TAG" -f ${{ matrix.service.dockerfile }} ${{ matrix.service.context }}
          IMAGE_DIGEST=$(docker inspect --format='{{index .Id}}' "$IMAGE_TAG")
          echo "image=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest Build Provenance (Pillar 5 Supply Chain)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.build-image.outputs.image }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
