name: Validate Enterprise Self-Host Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Ruby (for YAML validation)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Set up Node.js (for CycloneDX SBOM)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run verification harness
        run: ./verify-selfhost.sh

      - name: Generate CycloneDX SBOM (Pillar 5 Invariant)
        run: npx --yes @cyclonedx/cdxgen -o bom.json

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-self-host-sbom
          path: bom.json

      - name: Run Trivy Vulnerability Scanner (Fail-Closed)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
