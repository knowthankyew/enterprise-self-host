name: Validate Enterprise Self-Host Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Ruby (for YAML validation)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Set up Node.js (for CycloneDX SBOM)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Go (for Genesis auth security tests)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24'
          cache: false

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3

      - name: Clone sibling repositories
        run: ./clone-siblings.sh

      - name: Run verification harness
        env:
          GENESIS_AUTH_TOKEN: kty-ci-config-validation-token
        run: ./verify-selfhost.sh

      - name: Run claims audit unit tests
        run: node --test scripts/audit-claims.test.mjs

      - name: Run claims & architectural invariant audit
        env:
          KTY_REQUIRE_GO_TESTS: '1'
        run: node scripts/audit-claims.mjs

      - name: Generate CycloneDX SBOM (Pillar 5 Invariant)
        run: npx --yes @cyclonedx/cdxgen -o bom.json

      - name: Keyless Cryptographic Signing with Cosign (Pillar 5)
        if: github.ref == 'refs/heads/main'
        run: cosign sign-blob --yes --bundle bom.json.bundle bom.json

      - name: Attest SBOM Provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'bom.json'

      - name: Upload CycloneDX SBOM & Signature Bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-self-host-sbom
          path: |
            bom.json
            bom.json.bundle
          if-no-files-found: warn

      - name: Run Trivy Vulnerability Scanner (Fail-Closed)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
