name: Validate Enterprise Self-Host Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Ruby (for YAML validation)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Set up Node.js (for CycloneDX SBOM)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3

      - name: Clone sibling repositories
        run: ./clone-siblings.sh

      - name: Run verification harness
        run: ./verify-selfhost.sh

      - name: Generate CycloneDX SBOM (Pillar 5 Invariant)
        run: npx --yes @cyclonedx/cdxgen -o bom.json

      - name: Keyless Cryptographic Signing with Cosign (Pillar 5)
        if: github.ref == 'refs/heads/main'
        run: cosign sign-blob --yes --bundle bom.json.bundle bom.json

      - name: Attest SBOM Provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'bom.json'

      - name: Upload CycloneDX SBOM & Signature Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-self-host-sbom
          path: |
            bom.json
            bom.json.bundle
          if-no-files-found: warn

      - name: Run Trivy Vulnerability Scanner (Fail-Closed)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
