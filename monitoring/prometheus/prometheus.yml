# ==============================================================================
# Prometheus Configuration - knowthankyew Enterprise Monitoring Pack
# Scrapes local OpenTelemetry Collector & suite service health endpoints
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Scrape OpenTelemetry Collector Prometheus exporter
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Scrape FTaaS Control Plane
  - job_name: "ftaas-api"
    metrics_path: "/health"
    static_configs:
      - targets: ["ftaas-api:5000"]

  # Scrape GradCast API
  - job_name: "gradcast"
    metrics_path: "/health"
    static_configs:
      - targets: ["gradcast:5062"]

  # Scrape MailStripper status
  - job_name: "mail-stripper"
    metrics_path: "/api/strip/status"
    static_configs:
      - targets: ["mail-stripper:5001"]

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
