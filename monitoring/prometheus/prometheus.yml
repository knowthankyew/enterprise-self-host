# ==============================================================================
# Prometheus Configuration - knowthankyew Enterprise Monitoring Pack
# Scrapes local OpenTelemetry Collector (spanmetrics & internal metrics)
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Scrape OpenTelemetry Collector metrics exporter (spanmetrics & pipeline stats)
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
